[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-surfers"
version = "0.1.0"
description = "Turn Subway Surfers into a cardio workout: a webcam watches you jog in place and drives the game with your body"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jackie-Who" }]
keywords = ["computer-vision", "mediapipe", "pose-estimation", "opencv", "fitness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/Jackie-Who/cardio-surfers"
Issues = "https://github.com/Jackie-Who/cardio-surfers/issues"

[project.scripts]
cardio-surfers = "cardio_surfers.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
